[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
font = "'Public Sans':https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap, sans-serif"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap, serif"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
headingFontSizes = ["2.5rem", "1.5rem", "1.125rem"]
headingFontWeights = [600, 600, 600]
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#0f4c5c"
backgroundColor = "#fafbfc"
secondaryBackgroundColor = "#f0f3f5"
textColor = "#17202a"
borderColor = "#dbe1e6"
codeBackgroundColor = "#f0f3f5"
dataframeHeaderBackgroundColor = "#f0f3f5"

[theme.dark]
primaryColor = "#7cc0d0"
backgroundColor = "#0e1317"
secondaryBackgroundColor = "#161d23"
textColor = "#e2e8ec"
borderColor = "#27323a"
codeBackgroundColor = "#161d23"
dataframeHeaderBackgroundColor = "#161d23"
