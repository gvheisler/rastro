[project]
name = "rastro"
version = "0.1.0"
description = "Agente de IA que responde perguntas sobre emendas parlamentares federais com destino a Santa Catarina."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Heisler" }]
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlglot>=30.30.0",
    "typer>=0.15",
]

[project.scripts]
rastro = "rastro.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rastro"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
